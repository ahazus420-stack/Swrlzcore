name: INTEGRATION-FIX-011E CLIENT v1.0.1 Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - checkpoint/client-v101-build-failure-011e
    paths:
      - ".swrlz-recovery/INTEGRATION_FIX_011E_TRIGGER"

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: integration-fix-011e-client-v101-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'checkpoint/client-v101-build-failure-011e-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_RUN_ID: "29655230341"
      FAILED_JOB_ID: "88108225341"
      SOURCE_ZIP: "SOURCES/CLIENT/CLIENT_CFv1.0.1_SWRLZ.zip"
      EXPECTED_SOURCE_SHA: "9f567523ad184bfc14751d1aeaf527233a41a8e2a3e82378a68292a2e6a922f7"
      REPORT_PATH: "reports/INTEGRATION_FIX_011E_CLIENT_V101_BUILD_FAILURE_DIAGNOSTIC.md"
      ERROR_PATH: "BUILD_REQUESTS/INTEGRATION_FIX_011E/compiler-errors.txt"
      DIAGNOSTIC_BRANCH: "checkpoint/client-v101-build-failure-011e"
      TRIGGER_BRANCH: "checkpoint/client-v101-build-failure-011e-trigger"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: checkpoint/client-v101-build-failure-011e
          fetch-depth: 0

      - name: Verify promoted source without rebuilding
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          test "$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')" = "$EXPECTED_SOURCE_SHA"
          unzip -tq "$SOURCE_ZIP"

      - name: Retrieve failed job log
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB_ID/logs" > "$RUNNER_TEMP/failed-job.log"
          test -s "$RUNNER_TEMP/failed-job.log"

      - name: Extract compiler diagnostics and source context
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/client-v101"
          mkdir -p "$RUNNER_TEMP/client-v101" "$(dirname "$REPORT_PATH")" "$(dirname "$ERROR_PATH")"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/client-v101"
          python3 - <<'PY'
          from __future__ import annotations
          import os, pathlib, re
          from datetime import datetime, timezone

          log_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "failed-job.log"
          source_root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "client-v101"
          report_path = pathlib.Path(os.environ["REPORT_PATH"])
          error_path = pathlib.Path(os.environ["ERROR_PATH"])
          raw = log_path.read_text(encoding="utf-8", errors="replace")
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          lines = [ansi.sub("", line).rstrip() for line in raw.splitlines()]
          markers = (
              "e: file://", " error:", "error:", "Unresolved reference",
              "Type mismatch", "Cannot infer", "No value passed",
              "None of the following", "Execution failed for task",
              "FAILURE: Build failed", "* What went wrong:", "Compilation error",
          )
          hits = {i for i, line in enumerate(lines) if any(marker in line for marker in markers)}
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 3), min(len(lines), i + 5)))
          diagnostic_lines, last = [], -2
          for i in sorted(selected):
              if i > last + 1 and diagnostic_lines:
                  diagnostic_lines.append("...")
              diagnostic_lines.append(lines[i])
              last = i
          if not diagnostic_lines:
              raise SystemExit("No compiler/build diagnostic markers were found")

          location_re = re.compile(r"(?:file://)?(?P<path>/[^:\s]+\.(?:kt|kts|java)):(?P<line>\d+):(?P<col>\d+)")
          locations, seen = [], set()
          for line in lines:
              for match in location_re.finditer(line):
                  item = (match.group("path"), int(match.group("line")), int(match.group("col")))
                  if item not in seen:
                      locations.append(item)
                      seen.add(item)

          contexts = []
          for absolute, line_no, col_no in locations:
              candidates = []
              for token in ("CLIENT_CFv1.0.1_SWRLZ/", "CLIENT_CFv1.0.0_SWRLZ/"):
                  if token in absolute:
                      candidates.append(absolute.split(token, 1)[1])
              candidates.append(absolute.lstrip("/"))
              target = None
              for relative in candidates:
                  matches = list(source_root.rglob(pathlib.Path(relative).name))
                  exact = [p for p in matches if p.as_posix().endswith(relative)]
                  if exact:
                      target = exact[0]
                      break
                  if matches:
                      target = matches[0]
                      break
              if target is None:
                  contexts.append(f"### `{absolute}:{line_no}:{col_no}`\n\nSource file not resolved inside archive.\n")
                  continue
              src = target.read_text(encoding="utf-8", errors="replace").splitlines()
              start, end = max(1, line_no - 8), min(len(src), line_no + 8)
              excerpt = "\n".join(f"{n:5d} | {src[n-1]}" for n in range(start, end + 1))
              rel = target.relative_to(source_root).as_posix()
              contexts.append(f"### `{rel}:{line_no}:{col_no}`\n\n```text\n{excerpt}\n```\n")

          error_text = "\n".join(diagnostic_lines).strip() + "\n"
          error_path.write_text(error_text, encoding="utf-8")
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          report = f"""# INTEGRATION-FIX-011E — CLIENT v1.0.1 Build Failure Diagnostic

Generated: `{now}`

## Scope

- Source: `SOURCES/CLIENT/CLIENT_CFv1.0.1_SWRLZ.zip`
- Expected SHA-256: `{os.environ['EXPECTED_SOURCE_SHA']}`
- Failed workflow run: `{os.environ['FAILED_RUN_ID']}`
- Failed job: `{os.environ['FAILED_JOB_ID']}`
- This diagnostic did **not** invoke Gradle, assemble an APK, modify `main`, publish, release, deploy, or install.

## Extracted failure evidence

```text
{error_text.rstrip()}
```

## Referenced source context

{chr(10).join(contexts) if contexts else 'No file-and-line compiler location was recoverable from the log.'}

## Status

Root-cause classification and a minimal repair patch are prepared separately on this diagnostic branch after review of this evidence.
"""
          report_path.write_text(report, encoding="utf-8")
          PY

      - name: Commit diagnostic evidence to temporary branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT_PATH" "$ERROR_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "diagnostic(client): capture v1.0.1 build failure evidence"
            git push origin HEAD:"$DIAGNOSTIC_BRANCH"
          fi

      - name: Close signal PR and delete disposable trigger branch
        if: success()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "INTEGRATION-FIX-011E diagnostic evidence capture succeeded without Gradle or main modification. Evidence was committed to \`$DIAGNOSTIC_BRANCH\`."
          gh pr close "$PR_NUMBER" --comment "Disposable diagnostic signal PR closed without merge."
          git push origin --delete "$TRIGGER_BRANCH"
