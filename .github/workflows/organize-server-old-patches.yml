name: Correct SERVER files in CLIENT old patches

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/organize-server-old-patches.yml"

permissions:
  contents: write

jobs:
  correct-server-archive-location:
    name: Move legacy SERVER files into SERVER/OLD_PATCHES
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move legacy SERVER archive and checksum
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="SOURCES/CLIENT/OLD_PATCHES"
          DEST="SOURCES/SERVER/OLD_PATCHES"
          mkdir -p "$DEST"

          FILES=(
            "SERVER_0.7.3_DISCOVERY_FULL.zip"
            "SHA_SERVER_0.7.3_DISCOVERY_FULL.txt"
          )

          MOVED=0
          for NAME in "${FILES[@]}"; do
            FROM="$SOURCE/$NAME"
            TO="$DEST/$NAME"

            if [[ ! -f "$FROM" ]]; then
              echo "Expected misplaced SERVER file not found: $FROM" >&2
              exit 1
            fi

            if [[ -e "$TO" ]]; then
              if cmp -s "$FROM" "$TO"; then
                git rm -- "$FROM"
              else
                echo "Refusing to overwrite different existing file: $TO" >&2
                exit 1
              fi
            else
              git mv -- "$FROM" "$TO"
            fi

            MOVED=$((MOVED + 1))
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: move legacy SERVER files into SERVER old patches"
          git push

          echo "Moved $MOVED legacy SERVER files into $DEST."
