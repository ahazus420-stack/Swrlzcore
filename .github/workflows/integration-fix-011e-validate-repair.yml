name: INTEGRATION-FIX-011E CLIENT v1.0.1 Repair Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - checkpoint/client-v101-build-failure-011e
    paths:
      - ".swrlz-recovery/INTEGRATION_FIX_011E_TRIGGER"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: integration-fix-011e-client-v101-repair-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'checkpoint/client-v101-build-failure-011e-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DIAGNOSTIC_BRANCH: checkpoint/client-v101-build-failure-011e
      TRIGGER_BRANCH: checkpoint/client-v101-build-failure-011e-trigger
      REPORT_PATH: reports/INTEGRATION_FIX_011E_CLIENT_V101_MINIMAL_REPAIR_VALIDATION.md
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: checkpoint/client-v101-build-failure-011e
          fetch-depth: 0

      - name: Validate one-line repair without Gradle
        run: |
          set -euo pipefail
          python3 BUILD_REQUESTS/INTEGRATION_FIX_011E/validate_minimal_repair.py
          test -s "$REPORT_PATH"

      - name: Commit validation evidence to diagnostic branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$REPORT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "test(client): validate one-line Ktor request import repair"
            git push origin HEAD:"$DIAGNOSTIC_BRANCH"
          fi

      - name: Close signal PR and remove disposable branch
        if: success()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "INTEGRATION-FIX-011E static repair validation passed without Gradle, APK assembly, or main modification."
          gh pr close "$PR_NUMBER" --comment "Disposable validation signal closed without merge."
          git push origin --delete "$TRIGGER_BRANCH"
