
name: Build SWRLZ APK

on:
  push:
    paths:
      - "SOURCES/**"
      - ".github/workflows/build-swrlz-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve active build lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "SOURCES/CLIENT/*.zip" > /dev/null; then
            echo "target=CLIENT" >> "$GITHUB_OUTPUT"
            echo "lane_dir=SOURCES/CLIENT" >> "$GITHUB_OUTPUT"
          elif compgen -G "SOURCES/SERVER/*.zip" > /dev/null; then
            echo "target=SERVER" >> "$GITHUB_OUTPUT"
            echo "lane_dir=SOURCES/SERVER" >> "$GITHUB_OUTPUT"
          else
            echo "No source zips found."
            exit 1
          fi

      - name: Resolve newest source pair
        id: pair
        shell: bash
        env:
          LANE_DIR: ${{ steps.lane.outputs.lane_dir }}
          TARGET: ${{ steps.lane.outputs.target }}
        run: |
          set -euo pipefail
          ZIP=$(find "$LANE_DIR" -maxdepth 1 -name "${TARGET}_CFv*.zip" | sort -V | tail -n1)
          SHA="${ZIP%.zip}.sha256"
          test -f "$ZIP"
          test -f "$SHA"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify and extract
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.pair.outputs.zip }}"
          SHA="${{ steps.pair.outputs.sha }}"
          sha256sum -c "$SHA"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          ROOT=$(find extracted -maxdepth 2 -type d | tail -n1)

          if [ -f "$ROOT/android/gradlew" ]; then
            ANDROID_DIR="$ROOT/android"
          elif [ -f "$ROOT/gradlew" ]; then
            ANDROID_DIR="$ROOT"
          else
            echo "Unable to locate Android Gradle project."
            find extracted -maxdepth 4
            exit 1
          fi

          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        shell: bash
        working-directory: ${{ steps.extract.outputs.android_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lane.outputs.target }}-APK
          path: |
            ${{ steps.extract.outputs.android_dir }}/app/build/outputs/**/*.apk
