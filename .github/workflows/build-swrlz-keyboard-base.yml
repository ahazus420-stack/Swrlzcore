name: Build SWRLZ Keyboard Base

on:
  workflow_dispatch:
  push:
    paths:
      - 'SOURCES/KEYBOARD/SWRLZ_KEYBOARD_BASE_CFv1.0.1.zip'
      - 'SOURCES/KEYBOARD/SWRLZ_KEYBOARD_BASE_CFv1.0.1.sha256'
      - 'BUILD_REQUESTS/000_CURRENT.request'
      - '.github/workflows/build-swrlz-keyboard-base.yml'

permissions:
  contents: read

jobs:
  build-keyboard-base:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify source checksum
        working-directory: SOURCES/KEYBOARD
        run: sha256sum --check SWRLZ_KEYBOARD_BASE_CFv1.0.1.sha256

      - name: Extract keyboard inheritance source
        run: |
          set -euo pipefail
          rm -rf build-work/keyboard
          mkdir -p build-work/keyboard
          unzip -q SOURCES/KEYBOARD/SWRLZ_KEYBOARD_BASE_CFv1.0.1.zip -d build-work/keyboard

      - name: Regenerate Gradle wrapper
        working-directory: build-work/keyboard
        run: gradle wrapper --gradle-version 8.6 --distribution-type bin

      - name: Build keyboard base debug APK
        working-directory: build-work/keyboard
        run: ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Collect build evidence
        if: always()
        run: |
          mkdir -p build-evidence/keyboard
          gradle --version > build-evidence/keyboard/gradle-version.txt 2>&1 || true
          sha256sum SOURCES/KEYBOARD/SWRLZ_KEYBOARD_BASE_CFv1.0.1.zip > build-evidence/keyboard/source-archive.sha256
          find build-work/keyboard -type f -path '*/build/outputs/apk/*/*.apk' -print > build-evidence/keyboard/apk-paths.txt || true

      - name: Upload keyboard base debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SWRLZ_KEYBOARD_BASE_CFv1.0.1_DEBUG_APK
          path: build-work/keyboard/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload keyboard build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SWRLZ_KEYBOARD_BASE_CFv1.0.1_BUILD_EVIDENCE
          path: build-evidence/keyboard/
          if-no-files-found: warn
