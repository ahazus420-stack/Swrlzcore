name: Build sCore Launcher APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: Optional sCore Launcher source ZIP path; blank resolves the active lane
        required: false
        default: ""
      sha_file:
        description: Optional matching SHA-256 file path
        required: false
        default: ""
      build_variant:
        description: Android build variant
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

jobs:
  build-score-launcher:
    name: Build standalone sCore Launcher APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve request and Launcher source
        id: resolve
        env:
          INPUT_ZIP: ${{ inputs.source_zip }}
          INPUT_SHA: ${{ inputs.sha_file }}
          INPUT_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          REQUEST="BUILD_REQUESTS/000_CURRENT.request"
          [[ -f "$REQUEST" ]] || { echo "Missing $REQUEST" >&2; exit 1; }

          read_value() {
            grep -E "^$1=" "$REQUEST" | tail -n1 | cut -d= -f2- || true
          }

          ENABLED="$(read_value build_score_launcher)"
          LANE="$(read_value score_launcher_source_lane)"
          PATTERN="$(read_value score_launcher_source_pattern)"
          VARIANT="${INPUT_VARIANT:-$(read_value build_variant)}"
          [[ -n "$LANE" ]] || LANE="SOURCES/SCORE-LAUNCHER"
          [[ -n "$PATTERN" ]] || PATTERN="SCORE_LAUNCHER_CFv*_SWRLZ.zip"
          [[ "$VARIANT" == "debug" || "$VARIANT" == "release" ]] || { echo "Unsupported build variant: $VARIANT" >&2; exit 1; }

          ZIP="$INPUT_ZIP"
          if [[ -z "$ZIP" ]]; then
            [[ "$ENABLED" == "true" ]] || { echo "build_score_launcher is not true in $REQUEST and no manual source ZIP was supplied." >&2; exit 1; }
            mapfile -t ACTIVE_ZIPS < <(find "$LANE" -maxdepth 1 -type f -name "$PATTERN" | sort -V)
            [[ ${#ACTIVE_ZIPS[@]} -gt 0 ]] || { echo "No sCore Launcher source ZIP found in $LANE matching $PATTERN" >&2; exit 1; }
            ZIP="${ACTIVE_ZIPS[-1]}"
          fi
          [[ -f "$ZIP" ]] || { echo "sCore Launcher source ZIP not found: $ZIP" >&2; exit 1; }

          SHA="$INPUT_SHA"
          [[ -n "$SHA" ]] || SHA="${ZIP%.zip}.sha256"
          [[ -f "$SHA" ]] || { echo "Matching SHA-256 file not found: $SHA" >&2; exit 1; }

          SAFE_NAME="$(basename "${ZIP%.zip}" | tr -cs 'A-Za-z0-9._-' '_')"
          EXTRACT_DIR="$RUNNER_TEMP/$SAFE_NAME/extracted"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify source checksum
        env:
          ZIP: ${{ steps.resolve.outputs.zip }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          EXPECTED="$(awk '{print $1; exit}' "$SHA")"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          [[ -n "$EXPECTED" && "$EXPECTED" == "$ACTUAL" ]] || { echo "SHA-256 mismatch for $ZIP" >&2; exit 1; }

      - name: Extract and locate Gradle project
        id: project
        env:
          ZIP: ${{ steps.resolve.outputs.zip }}
          EXTRACT_DIR: ${{ steps.resolve.outputs.extract_dir }}
        run: |
          set -euo pipefail
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP" -d "$EXTRACT_DIR"
          GRADLEW="$(find "$EXTRACT_DIR" -maxdepth 6 -type f -name gradlew | sort | head -n1 || true)"
          [[ -n "$GRADLEW" ]] || { echo "No Gradle wrapper found in source ZIP" >&2; find "$EXTRACT_DIR" -maxdepth 4 -type f | sort >&2; exit 1; }
          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build sCore Launcher APK
        id: build
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          VARIANT: ${{ steps.resolve.outputs.variant }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          TASK="assemble$(tr '[:lower:]' '[:upper:]' <<< "${VARIANT:0:1}")${VARIANT:1}"
          ./gradlew --no-daemon --stacktrace clean "$TASK" | tee "$RUNNER_TEMP/score-launcher-gradle-build.log"
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/$VARIANT"
          [[ -d "$APK_DIR" ]] || { echo "APK output directory not found: $APK_DIR" >&2; find "$PROJECT_DIR" -type f -name '*.apk' >&2 || true; exit 1; }
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Record provenance
        env:
          ZIP: ${{ steps.resolve.outputs.zip }}
          SHA: ${{ steps.resolve.outputs.sha }}
          VARIANT: ${{ steps.resolve.outputs.variant }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          {
            echo "target=sCore Launcher"
            echo "source_zip=$ZIP"
            echo "sha_file=$SHA"
            echo "source_sha256=$(sha256sum "$ZIP" | awk '{print $1}')"
            echo "build_variant=$VARIANT"
            echo "project_dir=$PROJECT_DIR"
            echo "repository_commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/SCORE_LAUNCHER_BUILD_PROVENANCE.txt"

      - name: Upload sCore Launcher APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.safe_name }}-${{ steps.resolve.outputs.variant }}-artifacts
          if-no-files-found: error
          path: |
            ${{ steps.build.outputs.apk_dir }}/*.apk
            ${{ runner.temp }}/score-launcher-gradle-build.log
            ${{ runner.temp }}/SCORE_LAUNCHER_BUILD_PROVENANCE.txt
