name: SERVER-CONTRACT-CATCHUP-010D Promote v1.0.3

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PROMOTE SERVER-CONTRACT-CATCHUP-010D"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: server-contract-catchup-010d-v103
  cancel-in-progress: false

jobs:
  promote-server-v103:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUEST_DIR: BUILD_REQUESTS/SERVER_CONTRACT_CATCHUP_010D
      BASE_ZIP: SOURCES/SERVER/SERVER_CFv1.0.2_SWRLZ.zip
      BASE_SHA: 9d278bed4944eee20d6b9dc1ea89ba9363c30a7e7daa5b91b44836c386abd200
      OVERLAY_SHA: 4968790201758a506cc2b434da936473b4aa3889a237ae2851575b1d44cc0919
      OUTPUT_ZIP: SOURCES/SERVER/SERVER_CFv1.0.3_SWRLZ.zip

    steps:
      - name: Require explicit dispatch confirmation
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "PROMOTE SERVER-CONTRACT-CATCHUP-010D" ]] || {
            echo "Confirmation phrase mismatch." >&2
            exit 1
          }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical base and reconstruct compact overlay
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          test -f "$BASE_ZIP"
          ACTUAL_BASE_SHA="$(sha256sum "$BASE_ZIP" | awk '{print $1}')"
          [[ "$ACTUAL_BASE_SHA" == "$BASE_SHA" ]] || {
            echo "Canonical SERVER v1.0.2 checksum mismatch: $ACTUAL_BASE_SHA" >&2
            exit 1
          }
          unzip -tq "$BASE_ZIP"

          WORK="$RUNNER_TEMP/server-contract-catchup-010d"
          rm -rf "$WORK"
          mkdir -p "$WORK/overlay" "$WORK/output"
          cat "$REQUEST_DIR"/OVERLAY_PARTS/part-*.b64 | base64 -d > "$WORK/SERVER_CONTRACT_CATCHUP_010D_COMPACT_OVERLAY.zip"
          ACTUAL_OVERLAY_SHA="$(sha256sum "$WORK/SERVER_CONTRACT_CATCHUP_010D_COMPACT_OVERLAY.zip" | awk '{print $1}')"
          [[ "$ACTUAL_OVERLAY_SHA" == "$OVERLAY_SHA" ]] || {
            echo "Compact overlay checksum mismatch: $ACTUAL_OVERLAY_SHA" >&2
            exit 1
          }
          unzip -tq "$WORK/SERVER_CONTRACT_CATCHUP_010D_COMPACT_OVERLAY.zip"
          unzip -q "$WORK/SERVER_CONTRACT_CATCHUP_010D_COMPACT_OVERLAY.zip" -d "$WORK/overlay"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "OVERLAY_ROOT=$WORK/overlay/COMPACT_OVERLAY" >> "$GITHUB_ENV"

      - name: Apply routes and Glitch Dragon Core launcher resources
        run: |
          set -euo pipefail
          python "$OVERLAY_ROOT/APPLY_SERVER_CONTRACT_CATCHUP_010D.py" \
            "$BASE_ZIP" \
            "$OVERLAY_ROOT" \
            "$WORK/output"
          test -f "$WORK/output/SERVER_CFv1.0.3_SWRLZ.zip"
          test -f "$WORK/output/SERVER_CFv1.0.3_SWRLZ.sha256"
          unzip -tq "$WORK/output/SERVER_CFv1.0.3_SWRLZ.zip"
          cp "$WORK/output/SERVER_CFv1.0.3_SWRLZ.zip" "$OUTPUT_ZIP"
          cp "$WORK/output/SERVER_CFv1.0.3_SWRLZ.sha256" "${OUTPUT_ZIP%.zip}.sha256"

      - name: Verify successor contract and write provenance
        run: |
          set -euo pipefail
          EXPECTED="$(awk 'NF {print $1; exit}' "${OUTPUT_ZIP%.zip}.sha256")"
          ACTUAL="$(sha256sum "$OUTPUT_ZIP" | awk '{print $1}')"
          [[ "$EXPECTED" == "$ACTUAL" ]]
          TEMP="$RUNNER_TEMP/v103-check"
          rm -rf "$TEMP"; mkdir -p "$TEMP"
          unzip -q "$OUTPUT_ZIP" -d "$TEMP"
          ROOT="$(find "$TEMP" -type f -name gradlew -not -path '*/.gradle/*' -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          python "$ROOT/scripts/test_server_contract_catchup_010d.py" "$ROOT"
          grep -F 'versionName = "1.0.3"' "$ROOT/app/build.gradle.kts"
          cat > "${OUTPUT_ZIP%.zip}.md" <<DOC
          # SERVER_CFv1.0.3_SWRLZ

          - Component: SWRLZ Android NODE_HOST
          - Source lineage: SERVER_CFv1.0.2_SWRLZ.zip
          - Base SHA-256: $BASE_SHA
          - Current SHA-256: $ACTUAL
          - Checkpoint: SERVER-CONTRACT-CATCHUP-010D
          - Contract routes: /status, /presence/summary, /presence/groups, /presence/devices
          - Presence truth: authoritative empty state; no fabricated devices or groups
          - Branding: Glitch Dragon Core adaptive and legacy launcher resources
          - Packaging: deterministic source-only ZIP
          - APK build: delegated to the existing SERVER source-path build workflow
          DOC

      - name: Promote source and remove one-shot staging
        run: |
          set -euo pipefail
          git add "$OUTPUT_ZIP" "${OUTPUT_ZIP%.zip}.sha256" "${OUTPUT_ZIP%.zip}.md"
          git rm -r -- "$REQUEST_DIR" .github/workflows/server-contract-catchup-010d-promote-v103.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(server): promote contract catch-up and icon source v1.0.3"
          git push origin HEAD:main
