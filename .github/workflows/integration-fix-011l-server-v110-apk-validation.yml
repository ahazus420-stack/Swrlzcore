name: INTEGRATION-FIX-011L SERVER v1.1.0 APK Validation

on:
  pull_request:
    branches:
      - checkpoint/server-presence-registry-011k
    types: [opened, synchronize, reopened]
    paths:
      - ".swrlz-validation/INTEGRATION_FIX_011L_TRIGGER"

permissions:
  contents: read

concurrency:
  group: integration-fix-011l-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-server-v110:
    if: github.event.pull_request.head.ref == 'checkpoint/server-v110-build-011l-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_SOURCE_SHA: f1066675e7bccffac55bc56b8c5a5e4666ad4511c65bf84036a0a8d4bfc8a26f
      CANDIDATE_ZIP: BUILD_WORK/INTEGRATION_FIX_011L/SERVER_CFv1.1.0_SWRLZ.zip
      EXTRACT_DIR: BUILD_WORK/INTEGRATION_FIX_011L/extracted
      ARTIFACT_DIR: SERVER_011L_ARTIFACT

    steps:
      - name: Checkout exact checkpoint base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Materialize and verify exact SERVER candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf BUILD_WORK/INTEGRATION_FIX_011L "$ARTIFACT_DIR"
          mkdir -p "$(dirname "$CANDIDATE_ZIP")" "$EXTRACT_DIR" "$ARTIFACT_DIR"

          python3 BUILD_REQUESTS/INTEGRATION_FIX_011K/materialize_server_v110_011k.py \
            --base SOURCES/SERVER/SERVER_CFv1.0.3_SWRLZ.zip \
            --output "$CANDIDATE_ZIP" \
            | tee "$ARTIFACT_DIR/materialize_server_v110_011l.log"

          ACTUAL_SOURCE_SHA="$(sha256sum "$CANDIDATE_ZIP" | awk '{print $1}')"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          unzip -tq "$CANDIDATE_ZIP" | tee "$ARTIFACT_DIR/unzip_test.log"
          unzip -q "$CANDIDATE_ZIP" -d "$EXTRACT_DIR"

          PROJECT_ROOT="$EXTRACT_DIR/SWRLZ_NODE_HOST"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/gradlew"
          chmod +x "$PROJECT_ROOT/gradlew"

          echo "source_sha=$ACTUAL_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Build SERVER debug APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.source.outputs.project_root }}"
          LOG_PATH="$GITHUB_WORKSPACE/$ARTIFACT_DIR/build_server_debug.log"
          pushd "$PROJECT_ROOT" >/dev/null
          ./gradlew --no-daemon --stacktrace clean assembleDebug 2>&1 | tee "$LOG_PATH"
          popd >/dev/null

      - name: Collect APK and provenance
        if: success()
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="${{ steps.source.outputs.project_root }}"
          mapfile -t APKS < <(find "$PROJECT_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' -print | sort)
          if [[ "${#APKS[@]}" -ne 1 ]]; then
            echo "Expected exactly one debug APK, found ${#APKS[@]}" >&2
            printf '%s\n' "${APKS[@]:-}" >&2
            exit 1
          fi

          DEST="$ARTIFACT_DIR/SERVER_CFv1.1.0_SWRLZ_VALIDATION_debug.apk"
          cp "${APKS[0]}" "$DEST"
          APK_SHA="$(sha256sum "$DEST" | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' "$DEST")"
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"

          sha256sum "$DEST" > "$DEST.sha256"
          cat > "$ARTIFACT_DIR/BUILD_PROVENANCE_REPORT.md" <<EOF
          # INTEGRATION-FIX-011L SERVER APK validation provenance

          - Result: BUILD SUCCESS
          - Source candidate: SERVER_CFv1.1.0_SWRLZ.zip
          - Source SHA-256: $SOURCE_SHA
          - Source checkpoint branch: checkpoint/server-presence-registry-011k
          - Source checkpoint base SHA: ${{ github.event.pull_request.base.sha }}
          - Workflow run: ${{ github.run_id }}
          - Workflow job: ${{ github.job }}
          - Gradle task: clean assembleDebug
          - APK: SERVER_CFv1.1.0_SWRLZ_VALIDATION_debug.apk
          - APK SHA-256: $APK_SHA
          - APK size: $APK_SIZE bytes
          - Signing mode: debug-runner-default
          - Release artifact commit: false
          - Main promotion: false
          - CLIENT modification: false
          - Release/deploy/install: false
          EOF

          printf '%s\n' 'debug-runner-default' > "$ARTIFACT_DIR/SWRLZ_SIGNING_MODE.txt"
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "# INTEGRATION-FIX-011L SERVER v1.1.0 validation"
            echo
            echo "- Source SHA-256: $EXPECTED_SOURCE_SHA"
            echo "- Gradle task: clean assembleDebug"
            echo "- Job result: ${{ job.status }}"
            echo "- Release artifact commit: false"
            echo "- Main promotion: false"
            echo "- CLIENT change: false"
          } | tee "$ARTIFACT_DIR/GITHUB_ACTIONS_BUILD_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SERVER_CFv1.1.0_SWRLZ_VALIDATION_APK_DOWNLOAD
          path: SERVER_011L_ARTIFACT/
          if-no-files-found: error
          retention-days: 30
