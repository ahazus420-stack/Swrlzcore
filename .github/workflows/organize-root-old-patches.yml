name: Consolidate root OLD_PATCHES into CLIENT archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/organize-root-old-patches.yml"

permissions:
  contents: write

jobs:
  consolidate-old-patches:
    name: Move SOURCES/OLD_PATCHES into CLIENT/OLD_PATCHES
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate old patch contents
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="SOURCES/OLD_PATCHES"
          DEST="SOURCES/CLIENT/OLD_PATCHES"

          if [[ ! -d "$SOURCE" ]]; then
            echo "$SOURCE is already absent."
            exit 0
          fi

          mkdir -p "$DEST"
          MOVED=0

          while IFS= read -r -d '' ITEM; do
            NAME="$(basename "$ITEM")"
            TARGET="$DEST/$NAME"

            if [[ ! -e "$TARGET" ]]; then
              git mv -- "$ITEM" "$TARGET"
            elif [[ -f "$ITEM" && -f "$TARGET" ]] && cmp -s "$ITEM" "$TARGET"; then
              git rm -- "$ITEM"
            else
              SAFE_TARGET="$DEST/ROOT_OLD_PATCHES__$NAME"
              INDEX=1
              while [[ -e "$SAFE_TARGET" ]]; do
                SAFE_TARGET="$DEST/ROOT_OLD_PATCHES__${INDEX}__$NAME"
                INDEX=$((INDEX + 1))
              done
              git mv -- "$ITEM" "$SAFE_TARGET"
            fi

            MOVED=$((MOVED + 1))
          done < <(find "$SOURCE" -mindepth 1 -maxdepth 1 -print0)

          if [[ "$MOVED" -eq 0 ]]; then
            echo "$SOURCE contains no tracked items."
            exit 0
          fi

          rmdir "$SOURCE" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: consolidate root old patches into CLIENT archive"
          git push

          echo "Moved $MOVED item(s) from $SOURCE into $DEST."
