name: SWRLZ APK Router — Manual / Auto

on:
  workflow_dispatch:
    inputs:
      component:
        description: Android source lane to build
        required: true
        type: choice
        options:
          - CLIENT
          - SERVER
          - CORE_BASE
          - KEYBOARD_BASE
          - LAUNCHER_BASE
      source_zip:
        description: Optional explicit ZIP path inside the selected active source lane
        required: false
        default: ""
        type: string
      build_variant:
        description: Android build variant
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      commit_release_artifacts:
        description: Commit built files and latest-component manifest to the current branch
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'SOURCES/CLIENT/*.zip'
      - 'SOURCES/CLIENT/*.sha256'
      - 'SOURCES/CLIENT/*.sha'
      - 'SOURCES/CLIENT/*.txt'
      - 'SOURCES/SERVER/*.zip'
      - 'SOURCES/SERVER/*.sha256'
      - 'SOURCES/SERVER/*.sha'
      - 'SOURCES/SERVER/*.txt'
      - 'SOURCES/CORE_BASE/source/**'
      - 'SOURCES/CORE_BASE/*.zip'
      - 'SOURCES/CORE_BASE/*.sha256'
      - 'SOURCES/CORE_BASE/*.sha'
      - 'SOURCES/CORE_BASE/*.txt'
      - 'SOURCES/KEYBOARD/*.zip'
      - 'SOURCES/KEYBOARD/*.sha256'
      - 'SOURCES/KEYBOARD/*.sha'
      - 'SOURCES/KEYBOARD/*.txt'
      - 'SOURCES/LAUNCHER/*.zip'
      - 'SOURCES/LAUNCHER/*.sha256'
      - 'SOURCES/LAUNCHER/*.sha'
      - 'SOURCES/LAUNCHER/*.txt'
      - 'BUILD_REQUESTS/000_CURRENT.request'

permissions:
  contents: write

concurrency:
  group: swrlz-apk-router-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SWRLZ_BUILD_WORK_DIR: BUILD_WORK/ROUTER
  SWRLZ_ARTIFACT_ROOT: BUILD_ARTIFACTS/ROUTER

jobs:
  resolver-tests:
    name: Validate suffix-aware source resolver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run resolver unit tests
        working-directory: scripts/ci
        run: python3 test_resolve_swrlz_source.py

  prepare:
    name: Determine component route
    needs: resolver-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.route.outputs.matrix }}
      has_work: ${{ steps.route.outputs.has_work }}
      build_variant: ${{ steps.route.outputs.build_variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve manual, source-path, or request route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          MANUAL_COMPONENT: ${{ inputs.component || '' }}
          MANUAL_VARIANT: ${{ inputs.build_variant || 'debug' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          allowed = {
              "CLIENT",
              "SERVER",
              "CORE_BASE",
              "KEYBOARD_BASE",
              "LAUNCHER_BASE",
          }

          def parse_request(path: Path) -> dict[str, str]:
              values: dict[str, str] = {}
              if not path.is_file():
                  return values
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip()
              return values

          event = os.environ["EVENT_NAME"]
          components: set[str] = set()
          variant = "debug"

          if event == "workflow_dispatch":
              component = os.environ.get("MANUAL_COMPONENT", "").upper()
              if component not in allowed:
                  raise SystemExit(f"Unsupported manual component: {component!r}")
              components.add(component)
              variant = os.environ.get("MANUAL_VARIANT", "debug").lower()
          else:
              before = os.environ.get("BEFORE_SHA", "")
              after = os.environ["AFTER_SHA"]
              if not before or set(before) == {"0"}:
                  command = ["git", "show", "--pretty=", "--name-only", after]
              else:
                  command = ["git", "diff", "--name-only", before, after]
              changed = {
                  line.strip()
                  for line in subprocess.check_output(command, text=True).splitlines()
                  if line.strip()
              }

              lane_prefixes = {
                  "SOURCES/CLIENT/": "CLIENT",
                  "SOURCES/SERVER/": "SERVER",
                  "SOURCES/CORE_BASE/": "CORE_BASE",
                  "SOURCES/KEYBOARD/": "KEYBOARD_BASE",
                  "SOURCES/LAUNCHER/": "LAUNCHER_BASE",
              }
              for path in changed:
                  if "/OLD_PATCHES/" in path:
                      continue
                  for prefix, component in lane_prefixes.items():
                      if path.startswith(prefix):
                          components.add(component)
                          break

              if "BUILD_REQUESTS/000_CURRENT.request" in changed:
                  request = parse_request(Path("BUILD_REQUESTS/000_CURRENT.request"))
                  if request.get("enabled", "false").lower() == "true":
                      target = request.get("target", "").upper()
                      if target not in allowed:
                          raise SystemExit(f"Enabled build request has invalid target: {target!r}")
                      components.add(target)
                      variant = request.get("build_variant", "debug").lower()
                      if request.get("commit_release_artifacts", "false").lower() != "false":
                          raise SystemExit(
                              "Automatic request builds may not commit release artifacts; "
                              "use manual dispatch for that operation."
                          )

          if variant not in {"debug", "release"}:
              raise SystemExit(f"Unsupported build variant: {variant!r}")

          ordered = [
              component
              for component in (
                  "CLIENT",
                  "SERVER",
                  "CORE_BASE",
                  "KEYBOARD_BASE",
                  "LAUNCHER_BASE",
              )
              if component in components
          ]
          has_work = bool(ordered)
          matrix_components = ordered if ordered else ["CLIENT"]
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps({"component": matrix_components}) + "\n")
              handle.write(f"has_work={'true' if has_work else 'false'}\n")
              handle.write(f"build_variant={variant}\n")
          print(json.dumps({"components": ordered, "variant": variant}, indent=2))
          PY

  build:
    name: Build ${{ matrix.component }} APK
    needs:
      - resolver-tests
      - prepare
    if: needs.prepare.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve canonical source and checksum
        id: resolve
        env:
          COMPONENT: ${{ matrix.component }}
          MANUAL_SOURCE_ZIP: ${{ inputs.source_zip || '' }}
        run: |
          set -euo pipefail
          SOURCE_ARGUMENTS=()
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && -n "$MANUAL_SOURCE_ZIP" ]]; then
            SOURCE_ARGUMENTS+=(--source-zip "$MANUAL_SOURCE_ZIP")
          fi
          python3 scripts/ci/resolve_swrlz_source.py \
            --component "$COMPONENT" \
            --github-output "$GITHUB_OUTPUT" \
            "${SOURCE_ARGUMENTS[@]}"

      - name: Build selected Android component
        id: build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SWRLZ_API_TOKEN: ${{ secrets.SWRLZ_API_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          SOURCE_ZIP: ${{ steps.resolve.outputs.selected_source }}
          CANONICAL_STEM: ${{ steps.resolve.outputs.canonical_stem }}
          VARIANT: ${{ needs.prepare.outputs.build_variant }}
        run: |
          set -euo pipefail
          WORK_DIR="$SWRLZ_BUILD_WORK_DIR/$COMPONENT"
          ARTIFACT_DIR="$SWRLZ_ARTIFACT_ROOT/$COMPONENT"
          scripts/ci/build_swrlz_component.sh \
            "$COMPONENT" \
            "$SOURCE_ZIP" \
            "$CANONICAL_STEM" \
            "$VARIANT" \
            "$WORK_DIR" \
            "$ARTIFACT_DIR"

      - name: Record source-name normalization provenance
        env:
          ARTIFACT_DIR: ${{ steps.build.outputs.artifact_dir }}
          RESOLUTION_JSON: ${{ steps.resolve.outputs.resolution_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESOLUTION_JSON" > "$ARTIFACT_DIR/SOURCE_RESOLUTION.json"
          sha256sum "$ARTIFACT_DIR/SOURCE_RESOLUTION.json" > "$ARTIFACT_DIR/SOURCE_RESOLUTION.json.sha256"
          {
            echo "## ${{ matrix.component }} source resolution"
            echo
            echo "- Uploaded filename: \`${{ steps.resolve.outputs.uploaded_filename }}\`"
            echo "- Canonical filename: \`${{ steps.resolve.outputs.canonical_filename }}\`"
            echo "- Duplicate suffix: \`${{ steps.resolve.outputs.duplicate_suffix || '<none>' }}\`"
            echo "- Source SHA-256: \`${{ steps.resolve.outputs.source_sha256 }}\`"
            echo "- Checksum file: \`${{ steps.resolve.outputs.checksum_file }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.canonical_stem }}_${{ needs.prepare.outputs.build_variant }}_APK
          path: ${{ steps.build.outputs.artifact_dir }}/
          if-no-files-found: error
          retention-days: 30

      - name: Commit release artifacts when manually requested
        if: github.event_name == 'workflow_dispatch' && inputs.commit_release_artifacts
        env:
          COMPONENT: ${{ matrix.component }}
          ARTIFACT_DIR: ${{ steps.build.outputs.artifact_dir }}
          CANONICAL_STEM: ${{ steps.resolve.outputs.canonical_stem }}
          SOURCE_ZIP: ${{ steps.resolve.outputs.selected_source }}
          SOURCE_SHA256: ${{ steps.resolve.outputs.source_sha256 }}
          VARIANT: ${{ needs.prepare.outputs.build_variant }}
        run: |
          set -euo pipefail
          RELEASE_DIR="RELEASES/${CANONICAL_STEM}_APK"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR" UPDATES
          cp -a "$ARTIFACT_DIR"/. "$RELEASE_DIR"/

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          component = os.environ["COMPONENT"]
          manifest = {
              "schema": 2,
              "component": component,
              "canonical_source": os.environ["CANONICAL_STEM"] + ".zip",
              "selected_source": os.environ["SOURCE_ZIP"],
              "source_sha256": os.environ["SOURCE_SHA256"],
              "variant": os.environ["VARIANT"],
              "artifact_folder": "RELEASES/" + os.environ["CANONICAL_STEM"] + "_APK",
              "repository_commit": os.environ["GITHUB_SHA"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "built_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
          }
          name = component.lower()
          Path(f"UPDATES/latest_{name}.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RELEASE_DIR" "UPDATES/latest_${COMPONENT,,}.json"
          if git diff --cached --quiet; then
            echo 'No release artifact changes to commit.'
            exit 0
          fi
          git commit -m "build(${COMPONENT,,}): add ${CANONICAL_STEM} APK artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
