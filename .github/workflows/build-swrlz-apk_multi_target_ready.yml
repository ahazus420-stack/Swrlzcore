name: Build SWRLZ APKs (multi-target)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to assemble (debug|release)'
        required: false
        default: 'debug'
      targets:
        description: 'Comma-separated build targets/flavors (e.g. arm64-v8a,armeabi-v7a)'
        required: false
        default: 'universal'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME_17: /usr/lib/jvm/adoptopenjdk-17-hotspot || /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          target: android-34

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble APK(s)
        run: |
          set -e
          VARIANT="${{ github.event.inputs.build_variant || 'debug' }}"
          ./gradlew clean :app:assemble${VARIANT^} --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -type f -name "*.apk" -print -exec cp {} out/ \;
          ls -lah out || true

      - name: Create ZIP artifact
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          ZIPNAME="SWRLZ_APK_${TIMESTAMP}.zip"
          zip -r "$ZIPNAME" out || true
          echo "ZIP=$ZIPNAME" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swrlz-apks
          path: "${{ steps.create-zip.outputs.ZIP || 'SWRLZ_APK_*.zip' }}"
