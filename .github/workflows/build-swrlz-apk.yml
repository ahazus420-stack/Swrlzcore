name: Build SWRLZ APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build lane: CLIENT or SERVER. Leave blank to use BUILD_REQUESTS/000_CURRENT.request."
        required: false
        default: ""
      commit_release_artifacts:
        description: "Commit APK output and update manifests."
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "BUILD_REQUESTS/000_CURRENT.request"
      - "BUILD_REQUESTS/CURRENT.request"
      - ".github/workflows/build-swrlz-apk.yml"
      - "SOURCES/**"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SWRLZ_API_TOKEN: ${{ secrets.SWRLZ_API_TOKEN }}
  SWRLZ_SOURCES_DIR: SOURCES
  SWRLZ_BUILD_REQUESTS_DIR: BUILD_REQUESTS
  SWRLZ_BUILD_WORK_DIR: BUILD_WORK
  SWRLZ_RELEASES_DIR: RELEASES
  SWRLZ_UPDATES_DIR: UPDATES

jobs:
  build-swrlz-apk:
    name: Build SWRLZ APK from active lane
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve active build lane
        id: resolve
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_COMMIT_RELEASE_ARTIFACTS: ${{ github.event.inputs.commit_release_artifacts }}
        run: |
          set -euo pipefail
          mkdir -p "$SWRLZ_SOURCES_DIR" "$SWRLZ_BUILD_REQUESTS_DIR" "$SWRLZ_BUILD_WORK_DIR" "$SWRLZ_RELEASES_DIR" "$SWRLZ_UPDATES_DIR"

          REQUEST_FILE=""
          for candidate in "$SWRLZ_BUILD_REQUESTS_DIR/000_CURRENT.request" "$SWRLZ_BUILD_REQUESTS_DIR/CURRENT.request"; do
            if [[ -f "$candidate" ]]; then REQUEST_FILE="$candidate"; break; fi
          done

          R_TARGET=""
          R_COMMIT="false"
          if [[ -n "${REQUEST_FILE:-}" && -f "$REQUEST_FILE" ]]; then
            echo "Using active build request: $REQUEST_FILE"
            cat "$REQUEST_FILE"
            R_TARGET="$(grep -E '^target=' "$REQUEST_FILE" | tail -n 1 | cut -d= -f2- || true)"
            R_COMMIT="$(grep -E '^commit_release_artifacts=' "$REQUEST_FILE" | tail -n 1 | cut -d= -f2- || true)"
            [[ -n "${R_COMMIT:-}" ]] || R_COMMIT="true"
          fi

          TARGET="${INPUT_TARGET:-${R_TARGET:-}}"
          COMMIT_RELEASE_ARTIFACTS="${INPUT_COMMIT_RELEASE_ARTIFACTS:-${R_COMMIT:-false}}"

          if [[ -z "${TARGET:-}" ]]; then
            echo "Could not resolve target lane. Use target=CLIENT or target=SERVER." >&2
            exit 1
          fi

          TARGET="$(echo "$TARGET" | tr '[:lower:]' '[:upper:]')"
          case "$TARGET" in
            CLIENT|SERVER) ;;
            *) echo "Invalid target lane: $TARGET (expected CLIENT or SERVER)" >&2; exit 1 ;;
          esac

          LANE_DIR="$SWRLZ_SOURCES_DIR/$TARGET"
          [[ -d "$LANE_DIR" ]] || { echo "Missing lane directory: $LANE_DIR" >&2; exit 1; }

          {
            echo "target=$TARGET"
            echo "lane_dir=$LANE_DIR"
            echo "request_file=$REQUEST_FILE"
            echo "commit_release_artifacts=$COMMIT_RELEASE_ARTIFACTS"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve newest versioned source pair
        id: pair
        env:
          LANE_DIR: ${{ steps.resolve.outputs.lane_dir }}
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          mapfile -t ZIP_CANDIDATES < <(find "$LANE_DIR" -maxdepth 1 -type f -name "${TARGET}_CFv*.zip" | sort)
          if [[ ${#ZIP_CANDIDATES[@]} -eq 0 ]]; then
            echo "No source ZIPs found in $LANE_DIR matching ${TARGET}_CFv*.zip" >&2
            exit 0
          fi

          version_from_name() {
            local name="$1"
            if [[ "$name" =~ ${TARGET}_CFv([0-9]+)\.([0-9]+)\.([0-9]+)\.zip$ ]]; then
              printf '%s.%s.%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
            else
              return 1
            fi
          }

          semver_gt() {
            local a b c x y z
            IFS=. read -r a b c <<< "$1"
            IFS=. read -r x y z <<< "$2"
            if (( a > x )); then return 0; fi
            if (( a < x )); then return 1; fi
            if (( b > y )); then return 0; fi
            if (( b < y )); then return 1; fi
            (( c > z ))
          }

          BEST_ZIP=""
          BEST_VER=""
          for zip in "${ZIP_CANDIDATES[@]}"; do
            base="$(basename "$zip")"
            if ver="$(version_from_name "$base")"; then
              if [[ -z "${BEST_VER:-}" ]] || semver_gt "$ver" "$BEST_VER"; then
                BEST_VER="$ver"
                BEST_ZIP="$zip"
              fi
            fi
          done

          if [[ -z "${BEST_ZIP:-}" ]]; then
            echo "No versioned source ZIP matched ${TARGET}_CFvX.Y.Z.zip in $LANE_DIR" >&2
            exit 0
          fi

          SHA_CANDIDATE="${BEST_ZIP%.zip}.sha256"
          if [[ ! -f "$SHA_CANDIDATE" ]]; then
            SHA_CANDIDATE="${BEST_ZIP%.zip}.txt"
          fi
          if [[ ! -f "$SHA_CANDIDATE" ]]; then
            echo "Matching SHA file not found for $(basename "$BEST_ZIP")" >&2
            exit 0
          fi

          EXTRACT_DIR="$GITHUB_WORKSPACE/$SWRLZ_BUILD_WORK_DIR/${TARGET}_CFv${BEST_VER}/extracted"
          RELEASE_NAME="${TARGET}_CFv${BEST_VER}"

          {
            echo "source_zip=$BEST_ZIP"
            echo "sha_file=$SHA_CANDIDATE"
            echo "version=$BEST_VER"
            echo "release_name=$RELEASE_NAME"
            echo "extract_dir=$EXTRACT_DIR"
          } >> "$GITHUB_OUTPUT"

      - name: Verify and extract source
        id: extract
        env:
          ZIP: ${{ steps.pair.outputs.source_zip }}
          SHA_FILE: ${{ steps.pair.outputs.sha_file }}
          EXTRACT_DIR: ${{ steps.pair.outputs.extract_dir }}
        run: |
          set -euo pipefail
          if [[ -z "${ZIP:-}" || -z "${SHA_FILE:-}" ]]; then
            echo "No complete source pair available yet. Nothing to build." >&2
            exit 0
          fi

          if [[ -n "${SHA_FILE:-}" ]]; then
            cat "$SHA_FILE"
            EXPECTED_NAME="$(awk 'NF >= 2 {print $2; exit}' "$SHA_FILE")"
            if [[ -n "${EXPECTED_NAME:-}" && ! -f "$EXPECTED_NAME" ]]; then cp "$ZIP" "$EXPECTED_NAME"; fi
            sha256sum -c "$SHA_FILE"
          fi

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -o "$ZIP" -d "$EXTRACT_DIR"
          BUILD_SCRIPT="$(find "$EXTRACT_DIR" -maxdepth 8 -type f -path '*/scripts/install_android_sdk_and_build.sh' | sort | head -n 1)"
          if [[ -z "${BUILD_SCRIPT:-}" || ! -f "$BUILD_SCRIPT" ]]; then
            echo "Could not find scripts/install_android_sdk_and_build.sh" >&2
            find "$EXTRACT_DIR" -maxdepth 8 -type f | sort | head -n 300 >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$(dirname "$BUILD_SCRIPT")")"
          chmod +x "$BUILD_SCRIPT"
          ANDROID_DIR="$PROJECT_DIR"
if [[ -d "$PROJECT_DIR/android" ]]; then
  ANDROID_DIR="$PROJECT_DIR/android"
fi
echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Preflight validation
        env:
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SWRLZ_API_TOKEN: ${{ secrets.SWRLZ_API_TOKEN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "${OPENAI_API_KEY:-}" ]] || fail "OPENAI_API_KEY secret is missing or empty."
          [[ -n "${SWRLZ_API_TOKEN:-}" ]] || fail "SWRLZ_API_TOKEN secret is missing or empty."
          [[ -d "$PROJECT_DIR" ]] || fail "Project directory does not exist: $PROJECT_DIR"
          [[ -d "$ANDROID_DIR" ]] || fail "Android directory does not exist: $ANDROID_DIR"
          BACKEND_ENV_DIR="$(find "$PROJECT_DIR" -maxdepth 3 -type d -name backend | sort | head -n 1 || true)"
          [[ -n "${BACKEND_ENV_DIR:-}" ]] || fail "Could not find a backend directory under $PROJECT_DIR."
          [[ -d "$BACKEND_ENV_DIR" ]] || fail "Backend directory is not accessible: $BACKEND_ENV_DIR"
          BUILD_SCRIPT="$PROJECT_DIR/scripts/install_android_sdk_and_build.sh"
          [[ -f "$BUILD_SCRIPT" ]] || fail "Missing build script: $BUILD_SCRIPT"
          [[ -x "$BUILD_SCRIPT" ]] || chmod +x "$BUILD_SCRIPT"

      - name: Create backend .env
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SWRLZ_API_TOKEN: ${{ secrets.SWRLZ_API_TOKEN }}
        run: |
          set -euo pipefail

          BACKEND_ENV_DIR="$(find "$PROJECT_DIR" -maxdepth 3 -type d -name backend | sort | head -n 1 || true)"

          [[ -n "${BACKEND_ENV_DIR:-}" ]] || {
            echo "Could not find backend directory under $PROJECT_DIR" >&2
            exit 1
          }

          ENV_FILE="$BACKEND_ENV_DIR/.env"

          echo "SWRLZ_DATA_DIR=./data" > "$ENV_FILE"
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> "$ENV_FILE"
          echo "OPENAI_MODEL=gpt-5.4-mini" >> "$ENV_FILE"
          echo "SWRLZ_API_TOKEN=$SWRLZ_API_TOKEN" >> "$ENV_FILE"
          echo "CORS_ORIGINS=*" >> "$ENV_FILE"

      - name: Normalize Android build properties
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
        run: |
          set -euo pipefail
          MATCHES="$(grep -RIl '^android\.aapt2FromMavenOverride=' "$ANDROID_DIR" 2>/dev/null || true)"
          if [[ -n "${MATCHES:-}" ]]; then
            echo "$MATCHES" | while IFS= read -r file; do
              sed -i.bak '/^android\.aapt2FromMavenOverride=/d' "$file"
            done
          fi

      - name: Build Android debug APK
        id: build
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
          ANDROID_DIR: ${{ steps.extract.outputs.android_dir }}
          SAFE_RELEASE: ${{ steps.pair.outputs.release_name }}
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          bash scripts/install_android_sdk_and_build.sh

          OUT_DIR="$PROJECT_DIR/APK_DOWNLOAD"
          [[ -d "$OUT_DIR" ]] || { find "$PROJECT_DIR" -type f \( -iname '*.apk' -o -iname '*.aab' \); exit 1; }

          APK_SRC="$(find "$OUT_DIR" -maxdepth 1 -type f -iname '*.apk' | sort | head -n 1 || true)"
          if [[ -n "${APK_SRC:-}" ]]; then
            APK_DEST="$OUT_DIR/${SAFE_RELEASE}_debug.apk"
            [[ "$APK_SRC" == "$APK_DEST" ]] || mv "$APK_SRC" "$APK_DEST"
          fi

          ZIP_SRC="$(find "$OUT_DIR" -maxdepth 1 -type f -iname '*APK_DOWNLOAD*.zip' | sort | head -n 1 || true)"
          if [[ -n "${ZIP_SRC:-}" ]]; then
            ZIP_DEST="$OUT_DIR/${SAFE_RELEASE}_APK_DOWNLOAD.zip"
            [[ "$ZIP_SRC" == "$ZIP_DEST" ]] || mv "$ZIP_SRC" "$ZIP_DEST"
          fi

          echo "output_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          find "$OUT_DIR" -maxdepth 1 -type f -print -exec ls -lh {} \;

      - name: Stable dev signing status and optional APK re-sign
        id: signing
        env:
          OUT_DIR: ${{ steps.build.outputs.output_dir }}
          SWRLZ_DEV_KEYSTORE_BASE64: ${{ secrets.SWRLZ_DEV_KEYSTORE_BASE64 }}
          SWRLZ_DEV_KEYSTORE_PASSWORD: ${{ secrets.SWRLZ_DEV_KEYSTORE_PASSWORD }}
          SWRLZ_DEV_KEY_ALIAS: ${{ secrets.SWRLZ_DEV_KEY_ALIAS }}
          SWRLZ_DEV_KEY_PASSWORD: ${{ secrets.SWRLZ_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_MODE="debug-runner-default"
          if [[ -n "${SWRLZ_DEV_KEYSTORE_BASE64:-}" && -n "${SWRLZ_DEV_KEYSTORE_PASSWORD:-}" && -n "${SWRLZ_DEV_KEY_ALIAS:-}" && -n "${SWRLZ_DEV_KEY_PASSWORD:-}" ]]; then
            KEYSTORE="$RUNNER_TEMP/swrlz-dev-signing.jks"
            echo "$SWRLZ_DEV_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            APKSIGNER="$(find "${ANDROID_HOME:-$HOME}" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
            ZIPALIGN="$(find "${ANDROID_HOME:-$HOME}" -type f -name zipalign 2>/dev/null | sort -V | tail -n 1 || true)"
            [[ -n "${APKSIGNER:-}" && -n "${ZIPALIGN:-}" ]] || { echo "Stable signing requested, but apksigner/zipalign was not found." >&2; exit 1; }
            for APK in "$OUT_DIR"/*.apk; do
              [[ -f "$APK" ]] || continue
              BASE="${APK%.apk}"
              ALIGNED="${BASE}_aligned.apk"
              SIGNED="${BASE}_stable-signed.apk"
              "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
              "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:$SWRLZ_DEV_KEYSTORE_PASSWORD" --ks-key-alias "$SWRLZ_DEV_KEY_ALIAS" --key-pass "pass:$SWRLZ_DEV_KEY_PASSWORD" --out "$SIGNED" "$ALIGNED"
              "$APKSIGNER" verify "$SIGNED"
              rm -f "$ALIGNED"
            done
            SIGNING_MODE="stable-dev-signing-active"
          fi
          echo "$SIGNING_MODE" > "$OUT_DIR/SWRLZ_SIGNING_MODE.txt"
          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Archive older source patches after successful build
        env:
          LANE_DIR: ${{ steps.resolve.outputs.lane_dir }}
          TARGET: ${{ steps.resolve.outputs.target }}
          CURRENT_ZIP: ${{ steps.pair.outputs.source_zip }}
          CURRENT_SHA: ${{ steps.pair.outputs.sha_file }}
        run: |
          set -euo pipefail
          if [[ -z "${CURRENT_ZIP:-}" || -z "${CURRENT_SHA:-}" ]]; then
            echo "Nothing to archive." 
            exit 0
          fi
          OLD_DIR="$LANE_DIR/OLD_PATCHES"
          mkdir -p "$OLD_DIR"
          shopt -s nullglob
          for f in "$LANE_DIR"/${TARGET}_CFv*.zip "$LANE_DIR"/${TARGET}_CFv*.sha256 "$LANE_DIR"/${TARGET}_CFv*.txt; do
            [[ -f "$f" ]] || continue
            if [[ "$f" != "$CURRENT_ZIP" && "$f" != "$CURRENT_SHA" ]]; then
              mv "$f" "$OLD_DIR/"
            fi
          done

      - name: Create GitHub Actions build summary
        env:
          OUT_DIR: ${{ steps.build.outputs.output_dir }}
          RELEASE_NAME: ${{ steps.pair.outputs.release_name }}
          SOURCE_ZIP: ${{ steps.pair.outputs.source_zip }}
          SHA_FILE: ${{ steps.pair.outputs.sha_file }}
          TARGET: ${{ steps.resolve.outputs.target }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_WORKSPACE/$SWRLZ_UPDATES_DIR/${TARGET}_GITHUB_ACTIONS_BUILD_SUMMARY.md"
          {
            echo "# SWRLZ Build Summary"
            echo
            echo "Target: $TARGET"
            echo "Release: ${RELEASE_NAME:-unknown}"
            echo "Source ZIP: ${SOURCE_ZIP:-unknown}"
            echo "SHA: ${SHA_FILE:-unknown}"
            echo
            echo "## Outputs"
            find "$OUT_DIR" -maxdepth 1 -type f -print | sort
          } > "$SUMMARY"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pair.outputs.release_name }}
          path: |
            ${{ steps.build.outputs.output_dir }}
            ${{ env.SWRLZ_UPDATES_DIR }}/${{ steps.resolve.outputs.target }}_GITHUB_ACTIONS_BUILD_SUMMARY.md
          if-no-files-found: warn
